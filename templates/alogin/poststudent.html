<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-container label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-container button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #45a049;
        }

        .form-container p {
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Student Registration Form</h2>
        <form action="" method="post">
            {% csrf_token %}
            <label for="stdid">Student ID:</label>
            <input type="number" id="stdid" name="stdid" placeholder="Enter your student ID" required>

            <label for="stdname">Student Name:</label>
            <input type="text" id="stdname" name="stdname" placeholder="Enter your name" required>

            <label for="stuname">Username:</label>
            <input type="text" id="stuname" name="stuname" placeholder="Choose a username" required>

            <label for="stpassword">Password:</label>
            <input type="password" id="stpassword" name="stpassword" placeholder="Create a password" required>

            <label for="stemail">Email:</label>
            <input type="email" id="stemail" name="stemail" placeholder="Enter your email" required>

            <label for="stnum">Mobile Number:</label>
            <input type="text" id="stnum" name="stnum" placeholder="Enter your mobile number" required>

            <label for="saddress">Address:</label>
            <input type="text" id="saddress" name="saddress" placeholder="Enter your address" required>

            <button type="submit">Register</button>
        </form><br><br>
        <button  onclick="history.back()">Go Back</button>
        <p>All fields are mandatory.</p>
    </div>
</body>
</html>
