<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            display: block;
            margin: 10px 0;
            font-size: 18px;
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }

    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>User ID</th>
                <th>Password</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ obj.stid }}</td>
                <td>{{ obj.stname }}</td>
                <td>{{ obj.userid }}</td>
                <td>{{ obj.password }}</td>
                <td>{{ obj.mail }}</td>
                <td>{{ obj.mobile_no }}</td>
                <td>{{ obj.address }}</td>
            </tr>
        </tbody>
    </table>

    <a href="{% url 'viewattendance' obj.stid %}">View Attendance</a>
    <a href="{% url 'viewmarks' obj.stid %}">View Marks</a>
    <a href="{% url 'loginurl' %}" >Logout</a>

</body>
</html>
