<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ZP High School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #6a11cb, #2575fc);
        }

        .container {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #2575fc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1a5dc9;
        }

        .role-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .role-buttons a {
            text-decoration: none;
            color: #2575fc;
            font-weight: bold;
            transition: 0.3s;
        }

        .role-buttons a:hover {
            color: #1a5dc9;
        }

        .message {
            margin-top: 10px;
            color: red;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome to ZP High School</h2>

        <!-- Display Messages -->
        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form action="" method="post">
            {% csrf_token %}
            <div class="input-group">
                <label>Username:</label>
                <input type="text" name="uname" required>
            </div>

            <div class="input-group">
                <label>Password:</label>
                <input type="password" name="pwd" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="role-buttons">
            <a href="{% url 'aloginurl' %}">Admin Login</a>
            <a href="{% url 'loginurl' %}">Student Login</a>
            <a href="{% url 'tloginurl' %}">Teacher Login</a>
        </div>
    </div>

</body>
</html>
