<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-container button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-container button:hover {
            background-color: #45a049;
        }

        .form-container p {
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Teacher Registration Form</h2>
        <form action="" method="post">
            {% csrf_token %}
            <label for="teid">Teacher ID:</label>
            <input type="number" id="teid" name="teid" placeholder="Enter teacher ID" required>

            <label for="tename">Teacher Name:</label>
            <input type="text" id="tename" name="tename" placeholder="Enter teacher name" required>

            <label for="tesal">Salary:</label>
            <input type="text" id="tesal" name="tesal" placeholder="Enter salary" required>

            <label for="teuname">User ID:</label>
            <input type="text" id="teuname" name="teuname" placeholder="Enter user ID" required>

            <label for="tepassword">Password:</label>
            <input type="password" id="tepassword" name="tepassword" placeholder="Enter password" required>

            <label for="tenum">Mobile Number:</label>
            <input type="text" id="tenum" name="tenum" placeholder="Enter mobile number" required>

            <label for="teemail">Email:</label>
            <input type="email" id="teemail" name="teemail" placeholder="Enter email" required>

            <label for="taddress">Address:</label>
            <input type="text" id="taddress" name="taddress" placeholder="Enter address" required>

            <button type="submit">Register</button>
        </form><br>
        <button  onclick="history.back()">Go Back</button>
        <p>All fields are mandatory.</p>
    </div>
</body>
</html>
